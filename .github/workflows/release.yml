# Builds the Windows release zip when a GitHub release is published, and attaches it to the release
# together with the source archives of the bundled toolchain (GPLv3 source offer, see docs/release.md).
# Needs no ROM: the release contains no game code (the player's PC builds assets/game.dll on first run).
name: release
on:
  release:
    types: [published]
  workflow_dispatch:          # manual run: no tag = dry run (files kept as an artifact only);
    inputs:                   # tag = replace that release's toolchain source files with the single archive
      tag:
        description: "Existing release tag whose toolchain sources to (re)attach as one archive (empty = dry run)"
        required: false
        default: ""
permissions:
  contents: write
env:
  SDL_VERSION: 3.4.20
  W64DEVKIT_VERSION: 2.9.1
jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 zip glslang-tools p7zip-full

      - name: Version check
        run: |
          V=$(sed -n 's/^#define APP_VERSION "\(.*\)"/\1/p' core/frontend/version.h)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = release ] && [ "${{ github.event.release.tag_name }}" != "v$V" ]; then
            echo "tag ${{ github.event.release.tag_name }} does not match version.h ($V)"; exit 1
          fi

      - name: SDL3 and toolchain
        run: |
          D=$(cd .. && pwd)/deps; mkdir -p "$D" && cd "$D"
          curl -sSfLo sdl.tgz https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-devel-$SDL_VERSION-mingw.tar.gz
          tar xzf sdl.tgz
          curl -sSfLo w64.7z.exe https://github.com/skeeto/w64devkit/releases/download/v$W64DEVKIT_VERSION/w64devkit-x64-$W64DEVKIT_VERSION.7z.exe
          7z x -y -ow64 w64.7z.exe >/dev/null
          curl -sSfLo COPYING3 https://raw.githubusercontent.com/gcc-mirror/gcc/master/COPYING3
          cd "$GITHUB_WORKSPACE" && tools/trim_toolchain.sh "$D/w64/w64devkit" "$D/toolchain" "$D/COPYING3"

      - name: Build
        run: |
          make -s
          tools/build_frontend.sh futaribl windows

      - name: Package
        run: |
          mkdir -p dist
          tools/package_release.sh futaribl "dist/futaribl-v$VERSION-windows-x64.zip" > /dev/null
          if unzip -l "dist/futaribl-v$VERSION-windows-x64.zip" | grep -qi 'game\.dll'; then echo "game.dll in the zip!"; exit 1; fi
          unzip -l "dist/futaribl-v$VERSION-windows-x64.zip" | tail -1

      - name: Toolchain sources (GPL)
        run: |
          S=toolchain-sources-v$VERSION; mkdir -p "src/$S" && cd "src/$S"
          git clone -q --depth 1 --branch v$W64DEVKIT_VERSION https://github.com/skeeto/w64devkit w64src
          (cd w64src && git archive --format=zip --prefix=w64devkit-$W64DEVKIT_VERSION-source/ -o ../w64devkit-$W64DEVKIT_VERSION-source.zip HEAD)
          rm -rf w64src
          # versions from w64devkit's Dockerfile
          DF=$GITHUB_WORKSPACE/../deps/w64/w64devkit/Dockerfile
          v() { sed -n "s/.*$1_VERSION=\([^ \\\\]*\).*/\1/p" "$DF" | head -1; }
          G=$(v GCC); B=$(v BINUTILS); GMP=$(v GMP); MPC=$(v MPC); MPFR=$(v MPFR); MW=$(v MINGW)
          echo "gcc $G binutils $B gmp $GMP mpc $MPC mpfr $MPFR mingw-w64 $MW"
          for u in https://ftp.gnu.org/gnu/gcc/gcc-$G/gcc-$G.tar.xz \
                   https://ftp.gnu.org/gnu/binutils/binutils-$B.tar.xz \
                   https://ftp.gnu.org/gnu/gmp/gmp-$GMP.tar.xz \
                   https://ftp.gnu.org/gnu/mpc/mpc-$MPC.tar.xz \
                   https://ftp.gnu.org/gnu/mpfr/mpfr-$MPFR.tar.xz \
                   https://downloads.sourceforge.net/project/mingw-w64/mingw-w64/mingw-w64-release/mingw-w64-v$MW.tar.bz2; do
            curl -sSfL --retry 3 -O "$u"
          done
          printf 'Source code of the C compiler bundled in the release toolchain folder (w64devkit %s):\r\nGCC %s, GNU binutils %s, GMP %s, MPC %s, MPFR %s and Mingw-w64 %s, plus the w64devkit build\r\nscripts and patches that produced the binaries. Provided for the GNU GPL v3 source requirement.\r\nYou do not need these to play the game.\r\n' "$W64DEVKIT_VERSION" "$G" "$B" "$GMP" "$MPC" "$MPFR" "$MW" > README.txt
          cd .. && zip -q -0 -r "../dist/$S.zip" "$S" && ls -la ../dist

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - name: Replace the toolchain sources of an existing release (manual run with a tag)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" dist/toolchain-sources-*.zip --clobber
          for a in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '\.tar\.(xz|bz2|gz)$|^w64devkit-.*-source\.zip$'); do
            gh release delete-asset "$TAG" "$a" --yes
          done
          gh release view "$TAG" --json assets --jq '.assets[].name'

      - name: Keep as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          retention-days: 7
